version: "3.9"

services:
  migrate:
    build:
      context: .
      target: builder
    container_name: voiceai-migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql://voiceai:voiceai@postgres:5432/voiceai?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    profiles: ["setup"]

  app:
    build: .
    container_name: voiceai-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://voiceai:voiceai@postgres:5432/voiceai?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000" # exposed directly for local dev; in prod only nginx should be public
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: voiceai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: voiceai
      POSTGRES_PASSWORD: voiceai
      POSTGRES_DB: voiceai
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to loopback only — reachable from `npm run dev` on the same
    # host (matches the README's local-dev workflow) but NOT from the
    # internet, even if the VPS firewall is misconfigured. Contrast with
    # the old `"5432:5432"` which binds 0.0.0.0 and is publicly reachable
    # on any host without a firewall in front of it.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceai -d voiceai"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    container_name: voiceai-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro # mount certbot-issued certs here in prod

networks:
  default:
    name: voiceai-network
  # Bolna's own local_setup/docker-compose.yml runs as a SEPARATE stack
  # (see README.md → "Wiring up self-hosted Bolna") and joins this network
  # externally, rather than being reimplemented here. Their Dockerfiles
  # aren't reproduced in this repo — running their actual compose file is
  # the only way to stay in sync with their build as it changes upstream.

volumes:
  pgdata:
