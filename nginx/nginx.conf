events {
  worker_connections 1024;
}

http {
  # Needed for WebSocket upgrade (Bolna's media stream).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  # Edge-level rate limiting — a backstop in front of the app's own
  # per-route limiter (src/lib/rate-limit.ts). zone size 10m ~= 160k
  # tracked IPs, plenty for this scale.
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=api_webhooks:10m rate=10r/s;

  server {
    listen 80;
    server_name _; # replace with your domain, e.g. api-voice.yourportal.com

    # Uncomment once certbot has issued certs (see below), to force HTTPS:
    # return 301 https://$host$request_uri;

    location /api/webhooks/ {
      limit_req zone=api_webhooks burst=20 nodelay;
      proxy_pass http://app:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      limit_req zone=api_general burst=40 nodelay;
      proxy_pass http://app:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://app:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bolna's media WebSocket (local_setup/quickstart_server.py:
    # @app.websocket("/chat/v1/{agent_id}")). Lives on bolna-app:5001.
    # Join Bolna's compose stack to this network first (README.md ->
    # "Wiring up self-hosted Bolna") so `bolna-app` resolves.
    location /chat/v1/ {
      proxy_pass http://bolna-app:5001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s; # calls can run long; don't let nginx kill the socket
    }
  }

  # --- HTTPS server block ---
  # 1. Point your domain's A record at this server.
  # 2. Run certbot (standalone or webroot) to obtain certs into
  #    ./nginx/certs/ (fullchain.pem + privkey.pem).
  # 3. Uncomment this block, uncomment the redirect above, and reload:
  #    docker compose exec nginx nginx -s reload
  #
  # server {
  #   listen 443 ssl http2;
  #   server_name api-voice.yourportal.com;
  #
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   ssl_ciphers HIGH:!aNULL:!MD5;
  #   ssl_prefer_server_ciphers on;
  #
  #   add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  #   add_header X-Content-Type-Options "nosniff" always;
  #   add_header X-Frame-Options "DENY" always;
  #   add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  #
  #   location /api/webhooks/ {
  #     limit_req zone=api_webhooks burst=20 nodelay;
  #     proxy_pass http://app:3000;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #   }
  #
  #   location /api/ {
  #     limit_req zone=api_general burst=40 nodelay;
  #     proxy_pass http://app:3000;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #   }
  #
